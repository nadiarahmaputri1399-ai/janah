<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARAPAN BANGSA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#05060b;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 15% 20%,rgba(112,0,255,.22),transparent 30%),
    radial-gradient(circle at 85% 35%,rgba(255,0,75,.18),transparent 32%),
    radial-gradient(circle at 50% 90%,rgba(0,110,255,.12),transparent 35%);
  pointer-events:none;
  z-index:-1;
}
.container{width:min(100%,820px);margin:auto;padding:16px 14px 40px}
.topbar{
  height:65px;display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px
}
.logo{font-size:29px;font-weight:900;letter-spacing:-1.5px}
.logo span{background:linear-gradient(90deg,#ff1744,#b000ff);-webkit-background-clip:text;color:transparent}
.top-icons{font-size:30px;display:flex;gap:18px}
.hero{
  position:relative;border:1px solid rgba(255,255,255,.14);
  border-radius:25px;padding:18px 14px 28px;
  background:linear-gradient(145deg,rgba(25,20,55,.96),rgba(10,8,20,.96));
  box-shadow:0 0 45px rgba(180,0,255,.16),inset 0 0 30px rgba(255,0,100,.05);
  overflow:hidden;
}
.hero:after{
  content:"";position:absolute;width:240px;height:240px;border-radius:50%;
  background:rgba(255,0,80,.15);filter:blur(70px);right:-90px;top:-90px
}
.preview{
  height:250px;border-radius:20px;position:relative;overflow:hidden;
  background:
    linear-gradient(135deg,rgba(18,0,50,.35),rgba(130,0,50,.35)),
    url("IMG-20260916-WA0000.jpg") center/cover;
  border:1px solid rgba(255,255,255,.18);
}
.preview .play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
}
.play{
  width:72px;height:72px;border-radius:50%;border:2px solid #fff;
  background:rgba(5,5,15,.75);color:#fff;font-size:31px;cursor:pointer;
  display:grid;place-items:center;padding-left:5px;
  box-shadow:0 0 25px rgba(255,0,180,.65);
  transition:.2s;
}
.play:hover{transform:scale(1.08);background:#ff087e}
.hero h1{font-size:48px;line-height:1;margin:22px 0 10px;text-align:center}
.hero h1 span{background:linear-gradient(90deg,#fff,#ff1744,#c000ff);-webkit-background-clip:text;color:transparent}
.hero p{text-align:center;color:#c9c9d2;font-size:16px;margin-bottom:18px}
.main-btn{
  display:flex;justify-content:center;align-items:center;gap:10px;
  width:88%;max-width:430px;margin:auto;padding:17px 20px;border:0;border-radius:40px;
  color:white;font-size:18px;font-weight:800;cursor:pointer;
  background:linear-gradient(90deg,#ff193d,#e800ff);
  box-shadow:0 0 28px rgba(255,0,150,.35)
}
.section-title{font-size:25px;font-weight:900;margin:34px 4px 16px}
.section-title span{background:linear-gradient(90deg,#ff304b,#b000ff);-webkit-background-clip:text;color:transparent}
.channels{display:flex;flex-direction:column;gap:12px}
.channel{
  display:flex;align-items:center;gap:14px;padding:11px;border-radius:22px;
  background:linear-gradient(90deg,rgba(24,22,45,.96),rgba(12,11,22,.96));
  border:1px solid rgba(255,255,255,.15);
  cursor:pointer;transition:.2s;
}
.channel:hover{transform:translateY(-2px);border-color:#e600ff;box-shadow:0 0 22px rgba(170,0,255,.2)}
.thumb{
  width:105px;height:78px;border-radius:16px;display:grid;place-items:center;
  font-size:38px;background:linear-gradient(135deg,#6c00ff,#ec008c);
  flex:none
}
.channel:nth-child(2) .thumb{background:linear-gradient(135deg,#ff2020,#ff006a)}
.channel:nth-child(3) .thumb{background:linear-gradient(135deg,#0074ff,#5c00ff)}
.channel:nth-child(4) .thumb{background:linear-gradient(135deg,#ff007e,#8500ff)}
.channel:nth-child(5) .thumb{background:linear-gradient(135deg,#ff9d00,#8c4b00)}
.channel-info{flex:1;min-width:0}
.channel-info h3{font-size:19px;margin-bottom:12px}
.line{height:4px;width:105px;border-radius:5px;background:linear-gradient(90deg,#ff1744,#9d00ff)}
.small-play{
  width:48px;height:48px;font-size:20px;flex:none
}
.arrow{font-size:30px;color:#ddd}
.next{
  margin:25px auto 0;display:block;padding:13px 34px;border-radius:30px;
  background:transparent;color:#fff;border:2px solid #c000ff;font-size:16px;
  font-weight:800;cursor:pointer
}
@media(max-width:500px){
 .hero h1{font-size:39px}.preview{height:205px}.logo{font-size:25px}
 .thumb{width:92px;height:70px}.channel-info h3{font-size:17px}
}

/* ===== ANIMASI TAMBAHAN ===== */
html{scroll-behavior:smooth}
body:before{
  animation:bgPulse 7s ease-in-out infinite alternate;
}
@keyframes bgPulse{
  0%{transform:scale(1);opacity:.65}
  100%{transform:scale(1.12);opacity:1}
}

/* Cahaya bergerak */
body:after{
  content:"";
  position:fixed;
  width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,0,190,.22),transparent 68%);
  left:-100px;top:35%;
  pointer-events:none;z-index:-1;
  animation:lightMove 9s linear infinite;
}
@keyframes lightMove{
  0%{left:-120px;top:25%}
  50%{left:75%;top:55%}
  100%{left:-120px;top:80%}
}

/* Logo berkedip halus */
.logo{
  animation:logoGlow 2.5s ease-in-out infinite alternate;
}
@keyframes logoGlow{
  from{filter:drop-shadow(0 0 0 rgba(255,0,180,0))}
  to{filter:drop-shadow(0 0 12px rgba(255,0,180,.55))}
}

/* Hero naik turun */
.hero{
  animation:heroFloat 4s ease-in-out infinite;
}
@keyframes heroFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}

/* Gambar hero bergerak sedikit */
.preview{
  animation:previewGlow 3s ease-in-out infinite alternate;
}
@keyframes previewGlow{
  from{box-shadow:0 0 12px rgba(120,0,255,.12)}
  to{box-shadow:0 0 32px rgba(255,0,130,.28)}
}

/* Tombol play berdenyut */
.play{
  animation:playPulse 1.8s ease-in-out infinite;
}
@keyframes playPulse{
  0%,100%{box-shadow:0 0 18px rgba(255,0,180,.45)}
  50%{box-shadow:0 0 35px rgba(255,0,180,.9)}
}
.play:hover{animation:none}

/* Tombol utama */
.main-btn{
  position:relative;
  overflow:hidden;
  animation:buttonGlow 2s ease-in-out infinite;
}
.main-btn:before{
  content:"";
  position:absolute;
  top:0;left:-120%;
  width:65%;height:100%;
  transform:skewX(-25deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
  animation:shine 3s infinite;
}
@keyframes shine{
  0%{left:-120%}
  45%,100%{left:140%}
}
@keyframes buttonGlow{
  0%,100%{box-shadow:0 0 20px rgba(255,0,150,.3)}
  50%{box-shadow:0 0 35px rgba(255,0,150,.65)}
}

/* Channel muncul satu per satu */
.channel{
  opacity:0;
  transform:translateX(-30px);
  animation:channelIn .7s ease forwards;
}
.channel:nth-child(1){animation-delay:.1s}
.channel:nth-child(2){animation-delay:.25s}
.channel:nth-child(3){animation-delay:.4s}
.channel:nth-child(4){animation-delay:.55s}
.channel:nth-child(5){animation-delay:.7s}
@keyframes channelIn{
  to{opacity:1;transform:translateX(0)}
}

/* Thumbnail zoom perlahan */
.thumb{
  animation:thumbFloat 3s ease-in-out infinite alternate;
}
@keyframes thumbFloat{
  from{transform:scale(1)}
  to{transform:scale(1.035)}
}

/* Garis channel bergerak */
.line{
  position:relative;
  overflow:hidden;
}
.line:after{
  content:"";
  position:absolute;
  left:-60px;top:0;width:55px;height:100%;
  background:rgba(255,255,255,.7);
  transform:skewX(-25deg);
  animation:lineShine 2.2s infinite;
}
@keyframes lineShine{
  0%{left:-60px}
  55%,100%{left:130%}
}

/* Panah bergerak */
.arrow{
  animation:arrowMove 1.2s ease-in-out infinite alternate;
}
@keyframes arrowMove{
  from{transform:translateX(0)}
  to{transform:translateX(5px)}
}

/* Tombol berikutnya */
.next{
  animation:nextGlow 2.3s ease-in-out infinite alternate;
}
@keyframes nextGlow{
  from{box-shadow:0 0 8px rgba(190,0,255,.2)}
  to{box-shadow:0 0 24px rgba(255,0,120,.55)}
}

/* Bintang kecil bergerak */
.spark{
  position:fixed;
  width:4px;height:4px;border-radius:50%;
  background:#fff;
  box-shadow:0 0 10px #fff;
  pointer-events:none;
  z-index:0;
  opacity:.7;
  animation:starFloat linear infinite;
}
@keyframes starFloat{
  from{transform:translateY(105vh) scale(.5);opacity:0}
  15%{opacity:.8}
  85%{opacity:.8}
  to{transform:translateY(-10vh) scale(1.2);opacity:0}
}

/* Hormati pengguna yang mematikan animasi */
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation:none!important;
    scroll-behavior:auto!important;
  }
}

</style>
</head>

<script>
document.querySelectorAll(".smartlink").forEach(element => {

      alert("Smartlink belum diisi.");

    }

    
    window.open(url, "_blank", "noopener,noreferrer");

});
</script>

<script>
