<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05050a">
<title>spesial edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
<script>
(function(){
  var LINK_POPUNDER = 'https://uplcm.com/4/11563571';
  var KUNCI = 'popunderSudah';
  function sudah(){
    try { return sessionStorage.getItem(KUNCI); } catch(e){ return false; }
  }
  if (sudah()) return;
  function jalan(){
    if (sudah()) return;
    try { sessionStorage.setItem(KUNCI, '1'); } catch(e){}
    document.removeEventListener('click', jalan, true);
    window.open(LINK_POPUNDER, '_blank');
  }
  document.addEventListener('click', jalan, true);
})();
</script>
</head>
<body>
<div class="app">
  <div class="layar bingkai">
    <video id="video" playsinline preload="none"></video>
    <div class="gelap"></div>

    <div class="atas">
      <span class="live">LIVE</span>
      <div class="tab"><span>Mengikuti</span><span class="on">Untuk Anda</span></div>
      <span class="cari"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span>
    </div>
    <div class="lencana"><span class="hot">🔥 Trending #1</span><span>HD</span></div>

    <button class="tap" id="tombolPlay" type="button" aria-label="Putar video">
      <span class="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l15 8-15 8z"/></svg></span>
      <span class="sisa">Ketuk untuk memutar</span>
    </button>
    <button class="suara" id="tombolSuara" type="button" hidden>🔇 Ketuk untuk nyalakan suara</button>

    <div class="rail">
      <div class="ava"><div>V</div><b>+</b></div>
      <button class="ic" id="tombolSuka" type="button" aria-label="Suka">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 5 6.5 5c2 0 3.5 1.1 4.3 2.5h2.4C14 6.1 15.5 5 17.5 5 21 5 23.1 8.5 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg>
        <span>128,4 rb</span>
      </button>
      <button class="ic" type="button" aria-label="Komentar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.3 1.1 4.4 2.9 6L4 21l4.2-1.8c1.2.4 2.5.6 3.8.6 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg>
        <span>3.912</span>
      </button>
      <button class="ic" id="btnSimpan" type="button" aria-label="Simpan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
        <span>21 rb</span>
      </button>
      <button class="ic" id="tombolBagikan" type="button" aria-label="Bagikan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l8 7.5-8 7.5v-4.5c-5 0-8.5 1.5-11 5 1-5 4-10 11-11z"/></svg>
        <span>Bagikan</span>
      </button>
      <div class="disk"></div>
    </div>

    <div class="info">
      <div class="teks">
        <div class="user"><span>@vidioku.official</span> <span class="cek"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span></div>
        <p class="cap"><span>Detik-detik terakhir yang bikin semua kaget 😱 Tonton sampai habis!</span> <b>#viral #fyp #drama</b></p>
        <div class="musik"><span>♪</span><div class="jalan"><span>Suara asli · vidioku.official · Detik-Detik Terakhir</span></div></div>
      </div>
      <div class="progress"><i id="bar"></i></div>
    </div>

    <div class="toast" id="toast" hidden></div>
  </div>
</div>

<script src="script.js?v=8"></script>
<script>
(function(){
  var layar = document.querySelector(".layar");
  var video = document.getElementById("video");
  var bar = document.getElementById("bar");
  var toast = document.getElementById("toast");

  video.addEventListener("timeupdate", function(){
    if (video.duration) bar.style.transform = "scaleX(" + video.currentTime / video.duration + ")";
  });

  function tampil(pesan){
    toast.textContent = pesan; toast.hidden = false;
    clearTimeout(tampil.t);
    tampil.t = setTimeout(function(){ toast.hidden = true; }, 1800);
  }

  var suka = document.getElementById("tombolSuka");
  suka.addEventListener("click", function(){
    if (!suka.classList.contains("aktif")) return;
    var r = suka.getBoundingClientRect(), b = layar.getBoundingClientRect();
    for (var i = 0; i < 4; i++) {
      var h = document.createElement("span");
      h.className = "hati"; h.textContent = "❤";
      h.style.left = r.left - b.left + 6 + "px";
      h.style.top = r.top - b.top + "px";
      h.style.setProperty("--x", Math.random() * 60 - 40 + "px");
      h.style.animationDelay = i * 0.08 + "s";
      layar.appendChild(h);
      (function(el){ setTimeout(function(){ el.remove(); }, 1300); })(h);
    }
  });

  var simpan = document.getElementById("btnSimpan");
  simpan.addEventListener("click", function(){
    tampil(simpan.classList.toggle("simpan") ? "Disimpan" : "Batal disimpan");
  });
})();
</script>
</body>
</html>
