  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f1117;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 25px 20px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .play-icon-container {
      width: 72px;
      height: 72px;
      background: #1e2530;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 15px auto;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .play-icon-container:hover {
      transform: scale(1.05);
    }
    .play-triangle {
      width: 0;
      height: 0;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left: 22px solid #ffffff;
      margin-left: 4px;
    }
    h1 {
      font-size: 22px;
      color: #111827;
      margin-bottom: 15px;
      line-height: 1.3;
    }
    .badge-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 15px 12px;
      margin-bottom: 15px;
    }
    .badge-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13.5px;
      color: #334155;
      font-weight: 500;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .resolution-tag {
      background: #e2e8f0;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
    }
    .check-icon {
      color: #10b981;
      font-size: 15px;
      font-weight: bold;
    }
    .instruction {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 20px;
    }
    .btn-action {
      display: block;
      background: #1e2530;
      color: #ffffff;
      text-decoration: none;
      padding: 15px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 20px;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background: #2d3748;
    }
    .features {
      display: flex;
      justify-content: space-around;
      font-size: 12px;
      color: #4b5563;
      border-top: 1px solid #f1f5f9;
      padding-top: 15px;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Tombol Play menuju Smartlink -->
    <a href="https://vjjdeyyerlies.my.id/ujicoba/1" style="text-decoration: none;">
      <div class="play-icon-container">
        <div class="play-triangle"></div>
      </div>
    </a>

    <h1>Tonton Video Full HD</h1>

    <div class="badge-box">
      <div class="badge-content">
        <span>🎛️</span> Kualitas definisi tinggi <span class="resolution-tag">1080p</span> terdeteksi.
      </div>
      <div class="check-icon">✓</div>
    </div>

    <div class="instruction">
      • Klik tombol di bawah untuk memulai streaming.
    </div>

    <!-- Tombol Utama menuju Smartlink -->
    <a href="https://vjjdeyyerlies.my.id/ujicoba/1" class="btn-action">
      Lanjutkan Menonton &rarr;
    </a>

    <div class="features">
      <div class="feature-item">
        <span>🛡️</span> Aman & Terverifikasi
      </div>
      <div class="feature-item">
        <span>⚡</span> Streaming Cepat
      </div>
    </div>
  </div>

</body>
