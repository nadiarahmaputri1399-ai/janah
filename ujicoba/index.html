    * {

      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      padding: 35px 20px 25px 20px;
      border-radius: 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid #f0f0f0;
    }
    .play-btn-wrapper {
      display: inline-block;
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 25px;
    }
    .play-circle {
      width: 72px;
      height: 72px;
      background: #1e2530;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
      box-shadow: 0 4px 12px rgba(30, 37, 48, 0.3);
    }
    .play-triangle {
      width: 0;
      height: 0;
      border-top: 11px solid transparent;
      border-bottom: 11px solid transparent;
      border-left: 18px solid #ffffff;
      margin-left: 3px;
    }
    h1 {
      font-size: 26px;
      color: #111827;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 25px;
    }
    .info-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 18px 15px;
      margin-bottom: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .info-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      color: #334155;
      font-weight: 500;
      flex-wrap: wrap;
    }
    .res-badge {
      background: #e2e8f0;
      color: #1e293b;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
    }
    .check-icon {
      width: 20px;
      height: 20px;
      background: #22c55e;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 11px;
      font-weight: bold;
    }
    .instruction {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 25px;
      text-align: center;
      line-height: 1.4;
    }
    .btn-main {
      display: block;
      background: #1e2530;
      color: #ffffff;
      text-decoration: none;
      padding: 16px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 25px;
      box-shadow: 0 4px 12px rgba(30, 37, 48, 0.2);
    }
    .divider {
      height: 1px;
      background: #f1f5f9;
      margin-bottom: 22px;
    }
    .footer-features {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
      color: #4b5563;
      font-weight: 500;
    }

      align-items: center;
