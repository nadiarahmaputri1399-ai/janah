    body, html {
      margin: 0;

      width: 100%;
      height: 100%;
      background-color: #0f1117;

    body {

      width: 100%;

      display: flex;

      text-align: center;
      box-shadow: none;

    .play-btn {

      background: #1e2530;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;

    .play-btn::after {

      height: 0;

      padding: 16px;
      margin-bottom: 20px;
      font-size: 15px;
      color: #334155;
    }
    .info-box span {
      background: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .instruction {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
      text-align: left;
    }
    .btn {
      display: block;
      background: #1e2530;
      color: #ffffff;
      text-decoration: none;
      padding: 16px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 24px;
    }
    .footer-info {
      display: flex;
      justify-content: space-around;
      font-size: 13px;
      color: #4b5563;
      border-top: 1px solid #f1f5f9;
      padding-top: 16px;
