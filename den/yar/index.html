<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HARAPAN BANGSA</title>
  
  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --line: #e2e8f0;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 100%; 
      min-height: 100%; 
      margin: 0; 
      padding: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: var(--text); 
      background: var(--bg); 
      line-height: 1.45;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      -webkit-font-smoothing: antialiased;
    }

    .appbar {
      position: sticky; top: 0; z-index: 20;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      transform: translateZ(0);
      will-change: transform;
    }
    .bar-inner {
      width: 100%; max-width: 1200px; margin-inline: auto;
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    }
    .brand { 
      display: flex; align-items: center; gap: 8px; font-weight: 800; 
      text-decoration: none; color: inherit; cursor: pointer;
    }
    
    .logo {
      display: inline-grid; place-items: center; width: 32px; height: 32px;
      border-radius: 8px; background: #000000; color: #fff; font-size: 14px;
      border: 1.5px solid #3FE3FF;
    }
    .spacer { flex: 1; }
    
    .btn-upload {
      background-color: #000000;
      color: #ffffff;
      padding: 8px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #3FE3FF;
      transition: background-color 0.2s ease;
    }
    .btn-upload:hover { background-color: #111111; }

    .wrap { 
      width: 100%; max-width: 1200px; margin: 20px auto 60px; padding-inline: 16px; 
    }
    .video-grid {
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }

    @media (min-width: 768px) {
      .video-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr); 
        gap: 30px;
      }
    }

    .video-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .phone {
      position: relative;
      width: clamp(240px, 92vw, 360px);
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      background: #000;
      transform: translateZ(0);
      will-change: transform;
    }
    @media (min-width: 768px) {
      .phone { width: 100%; }
    }

    .phone video { width: 100%; height: 100%; object-fit: cover; }

    .video-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 99;
      background: rgba(0,0,0,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn-icon {
      width: 72px;
      height: 72px;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 2px solid #3FE3FF;
    }
    .play-btn-icon:hover { transform: scale(1.08); }
    .play-btn-icon::before {
      content: "";
      display: block;
      width: 0; height: 0;
      margin-left: 4px;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 20px solid #ffffff;
      z-index: 2;
    }
    
    .pagination-container {
      display: flex;
      justify-content: center;
      margin-top: 50px;
      margin-bottom: 40px;
    }
    .pagination-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #000000;
      padding: 10px 18px;
      border-radius: 9999px;
      position: relative;
      border: 1.5px solid #3FE3FF;
    }
    .pagination-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #000000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      border: 1.5px solid #3FE3FF;
      transition: transform 0.2s;
    }
    .pagination-btn:hover {
      transform: scale(1.08);
    }
    .pagination-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 28px;
      background: #0a0a0a;
      border-radius: 9999px;
      position: relative;
      min-width: 150px;
      border: 1px solid #3FE3FF;
    }
    .pagination-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.5px;
    }
    .pagination-info svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }
    .pagination-dots {
      display: flex;
      gap: 6px;
      margin-top: 5px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #444444;
    }
    .dot.active {
      width: 16px;
      border-radius: 4px;
      background: #3FE3FF;
    }
  </style>
  <script src="https://encouragementglutton.com/cc/fa/58/ccfa58e8e9fef8de16e4bba705d81a57.js"></script>
</head>
<body>

  <header class="appbar">
    <div class="bar-inner">
      <a class="brand ad-redirect" href="#" data-url="https://encouragementglutton.com/gwi99tevkm?key=a951953f6f752175e8b997858eb81517">
        <span class="logo">V</span>
        <span>VIDEY</span>
      </a>
      <div class="spacer"></div>
      <a href="#" class="btn-upload ad-redirect" data-url="https://encouragementglutton.com/gwi99tevkm?key=a951953f6f752175e8b997858eb81517">Upload</a>
    </div>
  </header>

  <main class="wrap">
    <div class="video-grid">
      <div class="video-card">
        <div class="phone">
          <div id="trap1" class="video-overlay" data-url="https://encouragementglutton.com/gwi99tevkm?key=a951953f6f752175e8b997858eb81517">
            <div id="btn1" class="play-btn-icon"></div>
          </div>
          <video id="vid1" playsinline preload="metadata" loop src="../../video/Adel_GeoL_video_no_watermark.mp4"></video>
        </div>
      </div>
    </div>

    <div class="pagination-container">
      <div class="pagination-bar">
        <a href="#" class="pagination-btn ad-redirect" data-url="https://encouragementglutton.com/gwi99tevkm?key=a951953f6f752175e8b997858eb81517" title="Sebelumnya">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </a>
        <div class="pagination-center">
          <div class="pagination-info">
            <svg viewBox="0 0 24 24"><path d="M18 4H6C4.9 4 4 4.9 4 6V18C4 19.1 4.9 20 6 20H18C19.1 20 20 19.1 20 18V6C20 4.9 19.1 4 18 4ZM11 16H9V14H11V16ZM11 12H9V10H11V12ZM11 8H9V6H11V8ZM15 16H13V14H15V16ZM15 12H13V10H15V12ZM15 8H13V6H15V8Z"/></svg>
            <span>01 / 03</span>
          </div>
          <div class="pagination-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
        <a href="#" class="pagination-btn ad-redirect" data-url="https://encouragementglutton.com/gwi99tevkm?key=a951953f6f752175e8b997858eb81517" title="Berikutnya">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>
      </div>
    </div>
  </main>

  <script>
    var totalKlikCurrent = 0;     
    var requiredClicks = 1;      
    var isCoolDownActive = false;   
    var allTraps = ['trap1']; 

    
    document.querySelectorAll('.ad-redirect').forEach(function(el) {
        el.addEventListener('click', function(e) {
            e.preventDefault();
            var adUrl = el.getAttribute('data-url') || "https://encouragementglutton.com/gwi99tevkm?key=a951953f6f752175e8b997858eb81517";
            window.open(adUrl, '_blank');
        });
    });

    function pasangTrapVideoGacor(trapId, vidId, btnId) {
        var trap = document.getElementById(trapId);
        var video = document.getElementById(vidId);
        var btnPlay = document.getElementById(btnId);
        if (!trap || !video) return;

        var adUrl = trap.getAttribute('data-url');

        trap.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();

            if (isCoolDownActive) return;

            totalKlikCurrent++;
            window.open(adUrl, '_blank');

            if (totalKlikCurrent < requiredClicks) {
                
                trap.style.display = 'none';
                setTimeout(function() {
                    trap.style.display = 'flex';
                }, 200);
            } else {
                
                trap.style.display = 'none';
                isCoolDownActive = true;

                video.setAttribute("controls", "controls"); 
                video.play().catch(function() {
                    video.muted = true;
                    video.play();
                });
                if(btnPlay) btnPlay.style.display = "none";

                setTimeout(function() {
                    isCoolDownActive = false;  
                    totalKlikCurrent = 0;
                    allTraps.forEach(function(id) {
                        var targetTrack = document.getElementById(id);
                        if (targetTrack) targetTrack.style.display = 'flex';
                    });
                }, 10000);
            }
        });
    }

    window.addEventListener('load', function() {
        pasangTrapVideoGacor('trap1', 'vid1', 'btn1');
    });
  </script>
</body>
  </html>
