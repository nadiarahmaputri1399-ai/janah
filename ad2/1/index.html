<body>
<div class="app">
  <div class="wadah">
    <div class="feed" id="feed"></div>

    <div class="atas">
      <span class="live">LIVE</span>
      <div class="tab"><span>Mengikuti</span><span class="on">Untuk Anda</span></div>
      <span class="cari"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span>
    </div>

    <div class="toast" id="toast" hidden></div>
  </div>
</div>
<template id="tplSlide">
  <section class="layar">
    <video playsinline preload="none"></video>
    <div class="gelap"></div>
    <div class="lencana"><span class="hot">🔥 Trending #1</span><span>HD</span></div>

    <button class="tap" type="button" aria-label="Putar video">
      <span class="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l15 8-15 8z"/></svg></span>
      <span class="sisa">Ketuk untuk memutar</span>
    </button>
    <button class="suara" type="button" hidden>🔇 Ketuk untuk nyalakan suara</button>

    <div class="rail">
      <div class="ava"><div>V</div><b>+</b></div>
      <button class="ic btn-suka" type="button" aria-label="Suka">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 5 6.5 5c2 0 3.5 1.1 4.3 2.5h2.4C14 6.1 15.5 5 17.5 5 21 5 23.1 8.5 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg>
        <span>128,4 rb</span>
      </button>
      <button class="ic btn-komen" type="button" aria-label="Komentar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.3 1.1 4.4 2.9 6L4 21l4.2-1.8c1.2.4 2.5.6 3.8.6 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg>
        <span>3.912</span>
      </button>
      <button class="ic btn-simpan" type="button" aria-label="Simpan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
        <span>21 rb</span>
      </button>
      <button class="ic btn-bagikan" type="button" aria-label="Bagikan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l8 7.5-8 7.5v-4.5c-5 0-8.5 1.5-11 5 1-5 4-10 11-11z"/></svg>
        <span>Bagikan</span>
      </button>
      <div class="disk"></div>
    </div>

    <div class="info">
      <div class="teks">
        <div class="user"><span>@spesialedition</span> <span class="cek"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span></div>
        <p class="cap"><span>Detik-detik terakhir yang bikin semua kaget 😱 Tonton sampai habis!</span> <b>#viral #fyp #drama</b></p>
        <div class="musik"><span>♪</span><div class="jalan"><span>Suara asli · vidioku.official · Detik-Detik Terakhir</span></div></div>
      </div>
      <div class="progress"><i></i></div>
    </div>
  </section>
</template>
