<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070B">
<title>Lumio Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body class="halaman-video">
<div class="bg" aria-hidden="true"></div>
<section class="pemutar" id="halamanVideo" aria-label="Pemutar video">
  <div class="pemutar-atas">
    <button class="kembali" id="btnKembali" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg></button>
    <div class="pemutar-judul"><b id="pJudul">Video</b><span><i class="dot"></i>LIVE · HD</span></div>
  </div>
  <div class="pemutar-isi">
    <div class="layar">
      <video id="pVideo" playsinline preload="metadata" loop controlslist="nodownload noplaybackrate" disablepictureinpicture oncontextmenu="return false"></video>
      <button class="layar-tutup" id="pTutup" aria-label="Putar video"><span class="layar-play"><span class="rip"></span><svg viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg></span><span class="layar-teks" id="pTeks">Ketuk untuk menonton</span></button>
      <button class="suara-btn" id="pSuara" hidden><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>Ketuk untuk nyalain suara</button>
    </div>
  </div>
</section>
<div class="toast" id="toast" role="status"></div>
<script src="iklan.js?v=5"></script>
<script src="script.js?v=5"></script>
</body>
</html>
