<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>azupan news</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 410px;
      /* Membuat card panjang ke bawah dengan padding besar */
      padding: 50px 24px 60px 24px;
      border-radius: 36px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid #f0f0f0;
    }
    .play-btn-wrapper {
      display: inline-block;
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 35px;
    }
    .play-circle {
      width: 80px;
      height: 80px;
      background: #1e2530;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
      box-shadow: 0 6px 16px rgba(30, 37, 48, 0.3);
    }
    .play-triangle {
      width: 0;
      height: 0;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-left: 20px solid #ffffff;
      margin-left: 4px;
    }
    h1 {
      font-size: 28px;
      color: #111827;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 30px;
    }
    .info-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 20px 15px;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .info-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14.5px;
      color: #334155;
      font-weight: 500;
      flex-wrap: wrap;
    }
    .res-badge {
      background: #e2e8f0;
      color: #1e293b;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
    }
    .check-icon {
      width: 22px;
      height: 22px;
      background: #22c55e;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }
    .instruction {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 35px;
      text-align: center;
      line-height: 1.4;
    }
    .btn-main {
      display: block;
      background: #1e2530;
      color: #ffffff;
      text-decoration: none;
      padding: 18px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 35px;
      box-shadow: 0 4px 15px rgba(30, 37, 48, 0.25);
    }
    .divider {
      height: 1px;
      background: #f1f5f9;
      margin-bottom: 25px;
    }
    .footer-features {
      display: flex;
      flex-direction: column;
      gap: 15px;
      font-size: 13.5px;
      color: #4b5563;
      font-weight: 500;
    }
    .feature-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Tombol Play (Mengarah ke Smartlink) -->
    <a href="https://vjjdeyyerlies.my.id/ris/3" class="play-btn-wrapper">
      <div class="play-circle">
        <div class="play-triangle"></div>
      </div>
    </a>

    <h1>Tonton Video Full HD</h1>

    <div class="info-box">
      <div class="info-top">
        <span>🎛️</span> Kualitas definisi tinggi <span class="res-badge">1080p</span> terdeteksi.
      </div>
      <div class="check-icon">✓</div>
    </div>

    <div class="instruction">
      • Klik tombol di bawah untuk memulai streaming.
    </div>

    <!-- Tombol Utama (Mengarah ke Smartlink) -->
    <a href="https://vjjdeyyerlies.my.id/ris/3" class="btn-main">
      Lanjutkan Menonton &rarr;
    </a>

    <div class="divider"></div>

    <div class="footer-features">
      <div class="feature-row">
        <span>🛡️</span> Aman & Terverifikasi
      </div>
      <div class="feature-row">
        <span>⚡</span> Streaming Cepat
      </div>
    </div>
  </div>

</body>
</html>
