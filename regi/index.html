<html lang="id"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shortlink Saya</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>🔗 Pemendek Tautan</h1>
    <p class="subtitle">Ubah URL panjang jadi pendek. Bisa banyak sekaligus, satu URL per baris.</p>

    <form id="shorten-form">
      <textarea id="urls" rows="4" placeholder="https://contoh.com/artikel-1
https://contoh.com/artikel-2
https://contoh.com/artikel-3" required=""></textarea>
      <select id="domain">
        <option value="">Domain default</option>
      <option value="shortgen.blog">shortgen.blog</option><option value="accimg.co">accimg.co</option><option value="acfimg.top">acfimg.top</option><option value="asupan.videoviral.ink">asupan.videoviral.ink</option><option value="baru.videowikwik.lol">baru.videowikwik.lol</option><option value="cdn.accimg.co">cdn.accimg.co</option><option value="cdn.genshortpro.tech">cdn.genshortpro.tech</option><option value="cdn2.acfimg.top">cdn2.acfimg.top</option><option value="cdn2.videv.ink">cdn2.videv.ink</option><option value="cdn2.vldev.cc">cdn2.vldev.cc</option><option value="genshortpro.tech">genshortpro.tech</option><option value="ih.tongkepo.lat">ih.tongkepo.lat</option><option value="jingkrung.baby">jingkrung.baby</option><option value="melaksugan.bond">melaksugan.bond</option><option value="mudah2an.melaksugan.bond">mudah2an.melaksugan.bond</option><option value="nomok.jingkrung.baby">nomok.jingkrung.baby</option><option value="tongkepo.lat">tongkepo.lat</option><option value="video.viralnew.fun">video.viralnew.fun</option><option value="videoviral.ink">videoviral.ink</option><option value="videowikwik.lol">videowikwik.lol</option><option value="videv.ink">videv.ink</option><option value="vidiey.fans">vidiey.fans</option><option value="viralnew.fun">viralnew.fun</option><option value="vldev.cc">vldev.cc</option></select>
      <input type="text" id="custom_code" placeholder="Kode custom (opsional, hanya jika 1 URL)">
      <button type="submit" id="submit-btn">Pendekkan</button>
    </form>

    <div id="result" class="result hidden">
      <p>Tautan pendek kamu:</p>
      <div class="short-url-box">
        <input type="text" id="short-url-output" readonly="">
        <button id="copy-btn">Salin</button>
      </div>
    </div>

    <div id="bulk-result" class="bulk-result hidden">
      <div class="bulk-summary" id="bulk-summary"></div>
      <div id="bulk-list" class="bulk-list"></div>
      <button id="copy-all-btn" class="secondary-btn" type="button">📋 Salin Semua yang Berhasil</button>
    </div>

    <div id="error" class="error hidden"></div>
  </div>

  <script>
    const form = document.getElementById('shorten-form');
    const resultBox = document.getElementById('result');
    const bulkResultBox = document.getElementById('bulk-result');
    const bulkSummary = document.getElementById('bulk-summary');
    const bulkList = document.getElementById('bulk-list');
    const errorBox = document.getElementById('error');
    const shortUrlOutput = document.getElementById('short-url-output');
    const copyBtn = document.getElementById('copy-btn');
    const copyAllBtn = document.getElementById('copy-all-btn');
    const domainSelect = document.getElementById('domain');
    const submitBtn = document.getElementById('submit-btn');

    let lastBulkResults = [];

    fetch('/api/domains')
      .then((r) => r.json())
      .then((data) => {
        (data.domains || []).forEach((d) => {
          const opt = document.createElement('option');
          opt.value = d;
          opt.textContent = d;
          domainSelect.appendChild(opt);
        });
      })
      .catch(() => {});

    function resetBoxes() {
      errorBox.classList.add('hidden');
      resultBox.classList.add('hidden');
      bulkResultBox.classList.add('hidden');
    }

    function renderBulkResults(data) {
      bulkSummary.textContent = 'Berhasil ' + data.success + ' dari ' + data.total + ' URL.';
      bulkList.innerHTML = data.results.map(function (r) {
        if (r.success) {
          return '<div class="bulk-item success"><div class="bulk-item-long">' + r.longUrl + '</div><div class="bulk-item-short">' + r.shortUrl + '</div></div>';
        }
        return '<div class="bulk-item error"><div class="bulk-item-long">' + r.longUrl + '</div><div class="bulk-item-error-msg">' + (r.error || 'Gagal') + '</div></div>';
      }).join('');
      bulkResultBox.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resetBoxes();

      const rawUrls = document.getElementById('urls').value
        .split('\n')
        .map((u) => u.trim())
        .filter((u) => u);

      const custom_code = document.getElementById('custom_code').value;
      const domain = domainSelect.value;

      if (rawUrls.length === 0) {
        errorBox.textContent = 'Masukkan minimal satu URL.';
        errorBox.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';

      try {
        if (rawUrls.length === 1) {
          const res = await fetch('/api/shorten', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: rawUrls[0], custom_code, domain })
          });
          const data = await res.json();

          if (!res.ok) {
            errorBox.textContent = data.error || 'Terjadi kesalahan.';
            errorBox.classList.remove('hidden');
            return;
          }

          shortUrlOutput.value = data.short_url;
          resultBox.classList.remove('hidden');
        } else {
          const res = await fetch('/api/shorten-bulk', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ urls: rawUrls, domain })
          });
          const data = await res.json();

          if (!res.ok) {
            errorBox.textContent = data.error || 'Terjadi kesalahan.';
            errorBox.classList.remove('hidden');
            return;
          }

          lastBulkResults = data.results;
          renderBulkResults(data);
        }
      } catch (err) {
        errorBox.textContent = 'Gagal terhubung ke server.';
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Pendekkan';
      }
    });

    copyBtn.addEventListener('click', () => {
      shortUrlOutput.select();
      document.execCommand('copy');
      copyBtn.textContent = 'Tersalin!';
      setTimeout(() => (copyBtn.textContent = 'Salin'), 1500);
    });

    copyAllBtn.addEventListener('click', () => {
      const text = lastBulkResults.filter((r) => r.success).map((r) => r.shortUrl).join('\n');
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        copyAllBtn.textContent = 'Tersalin!';
        setTimeout(() => (copyAllBtn.textContent = '📋 Salin Semua yang Berhasil'), 1500);
      });
    });
  </script>


</body></html>
